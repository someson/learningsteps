# Build, test and scan on every push and pull request; deploy main to AKS.
#
# The four check jobs have NO Azure access. Only `deploy` can request an OIDC
# token, and Azure trusts that token only for the `production` environment,
# which GitHub allows only from main (see infra-terraform/identity.tf).
#
# Every action is pinned by commit SHA and every tool image by digest: a
# moved tag cannot change what runs here. Dependabot bumps the actions.

name: CI/CD

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main midway through a deploy.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
  HADOLINT_IMAGE: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  # promtool only (alert rules); same image as the compose monitoring profile.
  PROMETHEUS_IMAGE: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
  RUFF_VERSION: 0.16.9

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install lint and test tools
        run: pip install "ruff==${RUFF_VERSION}" -r app/requirements-dev.txt

      - name: Lint
        run: ruff check app

      # Same compose file as local development: the API image built from
      # app/Dockerfile, the migrate step (schema + unprivileged app role) and
      # PostgreSQL. Readiness is polled rather than `up --wait`, which does
      # not cope reliably with the one-shot migrate container.
      - name: Start API and database
        run: |
          cp app/.env-sample app/.env
          cp app/.env.db-sample app/.env.db
          docker compose up -d --build
          curl -fsS --retry 60 --retry-delay 2 --retry-all-errors -o /dev/null http://localhost:8000/readyz

      # Throwaway accounts with random passwords, created the way an operator
      # would (create_user.py inside the API container).
      - name: Create test users
        run: |
          for n in 1 2; do
            pw="$(openssl rand -hex 16)"
            echo "::add-mask::$pw"
            echo "TEST_PASSWORD$([ $n = 2 ] && echo 2)=$pw" >> "$GITHUB_ENV"
            echo "$pw" | docker compose exec -T api python create_user.py "ci-user-$n"
          done
          echo "TEST_USER=ci-user-1" >> "$GITHUB_ENV"
          echo "TEST_USER2=ci-user-2" >> "$GITHUB_ENV"
          pw="$(openssl rand -hex 16)"
          echo "::add-mask::$pw"
          echo "TEST_ADMIN_PASSWORD=$pw" >> "$GITHUB_ENV"
          echo "TEST_ADMIN=ci-admin" >> "$GITHUB_ENV"
          echo "$pw" | docker compose exec -T api python create_user.py ci-admin --admin

      # METRICS_URL: also checks the Prometheus endpoint on its own port.
      - name: API tests
        run: python app/test_api.py
        env:
          METRICS_URL: http://localhost:9000/metrics

      - name: Container logs
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color

  scan-image:
    name: scan-image (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: app
          - image: caddy
            context: caddy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: |
          docker build -t "learningsteps-${{ matrix.image }}:ci" "${{ matrix.context }}"
          docker save -o "learningsteps-${{ matrix.image }}.tar" "learningsteps-${{ matrix.image }}:ci"

      # Scans the saved tarball, so the image that passes here is byte for
      # byte the one the deploy job pushes (no rebuild in between).
      - name: Trivy — fail on HIGH/CRITICAL
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" image \
            --input "learningsteps-${{ matrix.image }}.tar" \
            --severity HIGH,CRITICAL --exit-code 1 --no-progress

      - name: Keep image for deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.image }}
          path: learningsteps-${{ matrix.image }}.tar
          retention-days: 1
          if-no-files-found: error

  scan-iac:
    name: scan-iac
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy — Terraform
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" config \
            --tf-vars infra-terraform/terraform.tfvars.example \
            --severity HIGH,CRITICAL --exit-code 1 infra-terraform

      # The image scan does not see the web UI's npm packages (only the built
      # bundle ships), yet their code runs in every visitor's browser.
      - name: Trivy — web UI npm dependencies
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" fs \
            --scanners vuln --include-dev-deps \
            --severity HIGH,CRITICAL --exit-code 1 --no-progress app/frontend

      - name: Hadolint — Dockerfiles
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$HADOLINT_IMAGE" \
            hadolint app/Dockerfile caddy/Dockerfile

      # render.sh needs real values only to deploy; to scan, placeholders
      # that are syntactically valid are enough, and no Azure access is needed.
      - name: Render Kubernetes manifests (dummy values)
        env:
          IMAGE_TAG: ci
          ACR_LOGIN_SERVER: example.azurecr.io
          WORKLOAD_CLIENT_ID: 00000000-0000-0000-0000-000000000001
          MIGRATOR_CLIENT_ID: 00000000-0000-0000-0000-000000000002
          TENANT_ID: 00000000-0000-0000-0000-000000000003
          KEY_VAULT_NAME: example-kv
          INGRESS_IP: 203.0.113.10
          INGRESS_PIP_NAME: example-pip
          INGRESS_RG: example-rg
          DB_SUBNET_CIDR: 10.20.4.0/24
          ACME_EMAIL: ci@example.com
          ENTRA_CLIENT_ID: 00000000-0000-0000-0000-000000000004
          ENTRA_TENANT: 00000000-0000-0000-0000-000000000003
          ENTRA_ALLOWED_TENANTS: 00000000-0000-0000-0000-000000000003
        run: k8s-manifests/render.sh

      - name: Trivy — Kubernetes manifests
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" config \
            --severity HIGH,CRITICAL --exit-code 1 k8s-manifests/rendered

      # Applied by an operator (install.sh), not by this pipeline — scanned
      # all the same.
      - name: Trivy — monitoring manifests
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" config \
            --severity HIGH,CRITICAL --exit-code 1 k8s-manifests/monitoring

      # A broken rule file would stop the local Prometheus and be rejected
      # by the operator's admission webhook in AKS.
      - name: Promtool — alert rules and local Prometheus config
        run: |
          docker run --rm -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            --entrypoint /bin/promtool "$PROMETHEUS_IMAGE" check rules /etc/prometheus/rules.yml
          docker run --rm -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            --entrypoint /bin/promtool "$PROMETHEUS_IMAGE" check config --syntax-only /etc/prometheus/prometheus.yml

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: a secret removed later is still leaked
          persist-credentials: false

      - name: Gitleaks — full history
        run: |
          docker run --rm -v "$PWD:/repo" --user "$(id -u):$(id -g)" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            "$GITLEAKS_IMAGE" git /repo --redact --verbose --exit-code 1

  deploy:
    name: deploy
    needs: [build-test, scan-image, scan-iac, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # REQUIRED: Azure's federated credential trusts only the subject
    # repo:<owner>/<repo>:environment:production.
    environment:
      name: production
      url: https://${{ vars.INGRESS_IP }}/
    permissions:
      contents: read
      id-token: write # OIDC token for azure/login — this job only
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
      AKS_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME }}
      AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
      WORKLOAD_CLIENT_ID: ${{ vars.WORKLOAD_CLIENT_ID }}
      MIGRATOR_CLIENT_ID: ${{ vars.MIGRATOR_CLIENT_ID }}
      TENANT_ID: ${{ vars.TENANT_ID }}
      KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}
      INGRESS_IP: ${{ vars.INGRESS_IP }}
      INGRESS_PIP_NAME: ${{ vars.INGRESS_PIP_NAME }}
      INGRESS_RG: ${{ vars.INGRESS_RG }}
      DB_SUBNET_CIDR: ${{ vars.DB_SUBNET_CIDR }}
      ACME_EMAIL: ${{ vars.ACME_EMAIL }}
      # Sign-in with Microsoft (terraform output github_repository_variables).
      ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
      ENTRA_TENANT: ${{ vars.ENTRA_TENANT }}
      ENTRA_ALLOWED_TENANTS: ${{ vars.ENTRA_ALLOWED_TENANTS }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*
          merge-multiple: true

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # API: tagged with the commit SHA, pushed on every deploy.
      # Caddy: tagged with the git tree hash of caddy/, so the tag changes only
      # when Caddy's source does. An unchanged tag leaves the Caddy pod alone
      # (it runs Recreate with a single replica — a restart is a short outage).
      # An existing tag is never overwritten.
      - name: Push images to ACR
        run: |
          CADDY_IMAGE_TAG="$(git rev-parse HEAD:caddy)"
          echo "CADDY_IMAGE_TAG=$CADDY_IMAGE_TAG" >> "$GITHUB_ENV"
          az acr login -n "${ACR_LOGIN_SERVER%%.*}"

          docker load -i learningsteps-api.tar
          docker tag learningsteps-api:ci "$ACR_LOGIN_SERVER/learningsteps-api:$IMAGE_TAG"
          docker push "$ACR_LOGIN_SERVER/learningsteps-api:$IMAGE_TAG"

          if docker manifest inspect "$ACR_LOGIN_SERVER/learningsteps-caddy:$CADDY_IMAGE_TAG" >/dev/null 2>&1; then
            echo "Caddy $CADDY_IMAGE_TAG already in ACR — not pushed"
          else
            docker load -i learningsteps-caddy.tar
            docker tag learningsteps-caddy:ci "$ACR_LOGIN_SERVER/learningsteps-caddy:$CADDY_IMAGE_TAG"
            docker push "$ACR_LOGIN_SERVER/learningsteps-caddy:$CADDY_IMAGE_TAG"
          fi

      - name: Render manifests
        run: k8s-manifests/render.sh

      # The AKS API server accepts only admin_ip_ranges and runners have no
      # fixed IP, so kubectl runs inside the cluster via `az aks command
      # invoke`, authenticated as this identity (namespace-scoped RBAC Writer).
      # `az` exits 0 even when the remote command fails — check exitCode.
      - name: Migrate database
        working-directory: k8s-manifests/rendered/app
        run: |
          out="$(az aks command invoke -g "$AKS_RESOURCE_GROUP" -n "$AKS_CLUSTER_NAME" --file . -o json --command "
            kubectl apply -f serviceaccounts.yaml -f networkpolicies.yaml -f migrate-job.yaml &&
            kubectl wait -n learningsteps --for=condition=complete job/db-migrate-$IMAGE_TAG --timeout=240s ||
            { kubectl logs -n learningsteps job/db-migrate-$IMAGE_TAG --tail=100; exit 1; }")"
          jq -r .logs <<<"$out"
          exit "$(jq -r .exitCode <<<"$out")"

      - name: Roll out API and ingress
        working-directory: k8s-manifests/rendered/app
        run: |
          out="$(az aks command invoke -g "$AKS_RESOURCE_GROUP" -n "$AKS_CLUSTER_NAME" --file . -o json --command "
            kubectl apply -f api.yaml -f caddy.yaml &&
            kubectl rollout status -n learningsteps deploy/learningsteps-api --timeout=300s &&
            kubectl rollout status -n learningsteps deploy/caddy --timeout=180s")"
          jq -r .logs <<<"$out"
          exit "$(jq -r .exitCode <<<"$out")"

      # No -k: the Let's Encrypt certificate must be valid. / is the web UI.
      # /api/entries with a bogus session must be 401, not 5xx: the lookup
      # goes through Caddy, the API and the database. /docs needs a session;
      # an unknown page gets the 404 page, not a 5xx.
      - name: Smoke test
        run: |
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors \
            -o /dev/null -w "/ %{http_code}\n" "https://$INGRESS_IP/"
          for check in "/api/entries 401" "/docs 401" "/no-such-page 404"; do
            set -- $check
            code="$(curl -sS --retry 10 --retry-delay 6 --retry-all-errors -o /dev/null -w '%{http_code}' \
              -H 'Cookie: __Host-session=smoke-test' "https://$INGRESS_IP$1")"
            echo "$1 $code (want $2)"
            [ "$code" = "$2" ]
          done
