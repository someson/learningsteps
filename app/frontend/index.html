    <title>LearningSteps</title>
    <script>
      // Light by default; dark only if the user chose it (theme toggle).
      // Applied before first paint to avoid a flash.
      try {
        if (localStorage.getItem("ui-theme") === "dark") document.documentElement.classList.add("dark")
      } catch {}
    </script>
