# One ServiceAccount per workload, each federated to its own Azure identity
# (see infra-terraform/identity.tf). A pod can only obtain an Entra token for
# the identity whose federated credential names its ServiceAccount.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: learningsteps-sa
  namespace: learningsteps
  annotations:
    azure.workload.identity/client-id: "${WORKLOAD_CLIENT_ID}"
# Pods get the token they need from the Workload Identity webhook and the CSI
# driver; the default Kubernetes API token would only widen what a
# compromised pod could do.
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: learningsteps-migrator
  namespace: learningsteps
  annotations:
    azure.workload.identity/client-id: "${MIGRATOR_CLIENT_ID}"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: caddy
  namespace: learningsteps
automountServiceAccountToken: false
