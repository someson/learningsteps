# Creates the application DB role and applies the schema (app/api/migrate.py).
# Nothing else does this in the cloud: Terraform cannot reach the private
# server. Runs before every rollout; idempotent. The name carries the image
# tag because a Job's pod template is immutable.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate-${IMAGE_TAG}
  namespace: learningsteps
  labels:
    app.kubernetes.io/name: db-migrate
    app.kubernetes.io/part-of: learningsteps
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migrate
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: learningsteps-migrator
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ${API_IMAGE}
          args: ["migrate.py"]
          env:
            - name: ADMIN_DATABASE_URL_FILE
              value: /mnt/secrets/database-admin-url
            - name: DATABASE_URL_FILE
              value: /mnt/secrets/database-url
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: secrets
              mountPath: /mnt/secrets
              readOnly: true
      volumes:
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: db-migrator
