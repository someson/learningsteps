---
apiVersion: v1
kind: ConfigMap
metadata:
  name: learningsteps-api
  namespace: learningsteps
data:
  # Per pod. HPA max replicas (5) x 5 = 25, well under the ~50 connections
  # a B1ms Flexible Server allows.
  DB_POOL_MAX_SIZE: "5"
  # Trust X-Forwarded-For from any peer: the NetworkPolicy admits only Caddy
  # to this port, and Caddy overwrites the header with the real client IP.
  # Needed so login throttling and audit logs see clients, not Caddy.
  FORWARDED_ALLOW_IPS: "*"
  SESSION_TTL_HOURS: "12"
  # COOKIE_SECURE defaults to true and ENABLE_DOCS to false: not set here.

  # Sign-in with Microsoft Entra ID only (infra-terraform/entra.tf). Users
  # are created on first sign-in; no password accounts in the cluster.
  LOCAL_LOGIN: "false"
  ENTRA_CLIENT_ID: "${ENTRA_CLIENT_ID}"
  ENTRA_TENANT_ID: "${ENTRA_TENANT}"
  ENTRA_ALLOWED_TENANTS: "${ENTRA_ALLOWED_TENANTS}"
  ENTRA_REDIRECT_URI: "https://${INGRESS_IP}/api/auth/entra/callback"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: learningsteps-api
  namespace: learningsteps
  labels:
    app.kubernetes.io/name: learningsteps-api
    app.kubernetes.io/part-of: learningsteps
spec:
  # No replicas field: the HPA owns the count. Setting it here would reset
  # the scale on every apply.
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: learningsteps-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: learningsteps-api
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: learningsteps-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas over nodes so a node drain or failure never takes
      # out every copy at once.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: learningsteps-api
      containers:
        - name: api
          image: ${API_IMAGE}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: learningsteps-api
          env:
            # The password is read from a file mounted from Key Vault, so it
            # never appears in the pod spec, `kubectl describe` or /proc/*/environ.
            - name: DATABASE_URL_FILE
              value: /mnt/secrets/database-url
          # Liveness does not touch the database: a DB outage should take pods
          # out of rotation (readiness), not restart them in a loop.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: secrets
              mountPath: /mnt/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: db-app
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
# ClusterIP only: the API is reachable solely through Caddy, the cluster
# equivalent of uvicorn binding to 127.0.0.1 behind Caddy on the VM.
apiVersion: v1
kind: Service
metadata:
  name: learningsteps-api
  namespace: learningsteps
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: learningsteps-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: learningsteps-api
  namespace: learningsteps
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: learningsteps-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: learningsteps-api
  namespace: learningsteps
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: learningsteps-api
