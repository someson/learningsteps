# Caddy: the only thing exposed to the internet. Terminates TLS with a real
# Let's Encrypt certificate for the bare public IP (shortlived profile, ~6
# days, renewed automatically) and proxies to the API Service.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy
  namespace: learningsteps
data:
  Caddyfile: |
    {
        # Unprivileged ports; the Service maps 80/443 onto them.
        http_port  8080
        https_port 8443

        # Config comes from this ConfigMap and changes only via a rollout, so
        # the admin API has nothing to do. Off removes a local attack surface.
        admin off

        # Clients cannot put an IP address into TLS SNI (RFC 6066), so Caddy
        # falls back to the socket's local address — the pod IP — to pick a
        # certificate, while the certificate is for the public IP. Without
        # default_sni every handshake fails with "tls: internal error".
        default_sni ${INGRESS_IP}

        email ${ACME_EMAIL}

        servers {
            # The load balancer forwards TCP only; advertising HTTP/3 (UDP)
            # would send clients to a port that is not there.
            protocols h1 h2
        }

        # rate_limit is a plugin (caddy/main.go) and has no default position.
        order rate_limit before reverse_proxy
    }

    ${INGRESS_IP} {
        tls {
            issuer acme {
                # Let's Encrypt issues IP certificates only under this profile.
                profile shortlived
            }
        }

        # Probe and metrics endpoints are for the cluster, not the internet.
        @internal path /healthz /readyz /metrics
        respond @internal 404

        # Oversized bodies are cut off here, before they reach the API (which
        # enforces its own 16 KiB limit as well).
        request_body {
            max_size 64KB
        }

        # Per-client limits, keyed by the real client IP (the Service keeps
        # it: externalTrafficPolicy Local). Over the limit: 429 + Retry-After.
        # One Caddy replica, so in-memory counters see all traffic. The API
        # also throttles failed logins per account, across its replicas.
        rate_limit {
            zone login {
                match {
                    method POST
                    path /api/auth/login
                }
                key {remote_host}
                events 10
                window 1m
            }
            zone api {
                match {
                    path /api/*
                }
                key {remote_host}
                events 300
                window 1m
            }
        }

        reverse_proxy learningsteps-api:8000

        # When the API cannot answer at all (no ready pod, rollout, crash),
        # the error comes from Caddy itself. Same split as the app: JSON for
        # /api, a web page for people. Only 502-504: other Caddy errors
        # (429 rate limit, 413 body size) keep their plain responses.
        handle_errors 502 503 504 {
            header Cache-Control "no-store"
            header Retry-After "30"
            @api path /api/*
            handle @api {
                header Content-Type "application/json"
                respond `{"detail":"Service temporarily unavailable"}` {err.status_code}
            }
            handle {
                header Content-Type "text/html; charset=utf-8"
                header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
                respond <<HTML
                    <!doctype html>
                    <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
                    <meta name="robots" content="noindex"><title>Temporarily unavailable · LearningSteps</title>
                    <style>*{box-sizing:border-box}body{margin:0;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:16px;background:#fafafa;color:#0a0a0a;font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}main{width:100%;max-width:420px;text-align:center}.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:24px;font-weight:600}.logo{width:36px;height:36px;border-radius:9px;background:#171717;display:grid;place-items:center}.card{background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:32px 24px;box-shadow:0 1px 2px rgba(0,0,0,.05)}.code{font-size:56px;font-weight:700;letter-spacing:-.04em;line-height:1;margin:0 0 12px;color:#0a0a0a}h1{font-size:20px;margin:0 0 8px}p{margin:0;color:#737373;font-size:14px}.btn{display:inline-flex;align-items:center;height:36px;padding:0 16px;margin-top:24px;border-radius:8px;background:#171717;color:#fafafa;font-size:14px;font-weight:500;text-decoration:none}</style>
                    </head><body><main>
                    <div class="brand"><span class="logo"><svg viewBox="0 0 32 32" width="20" height="20" fill="none" aria-hidden="true"><path d="M6 24h5v-5h5v-5h5V9h5" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>LearningSteps</div>
                    <div class="card"><p class="code">{err.status_code}</p><h1>Temporarily unavailable</h1>
                    <p>LearningSteps is restarting or under maintenance. Your entries are safe. Please try again in a minute.</p>
                    <a class="btn" href="">Try again</a></div>
                    </main></body></html>
                    HTML {err.status_code}
            }
        }

        encode gzip

        header {
            Strict-Transport-Security "max-age=31536000"
            X-Content-Type-Options "nosniff"
            Referrer-Policy "no-referrer"
            -Server
        }

        log {
            output stdout
            format json
        }
    }
---
# Certificate + ACME account. Without persistence every pod restart requests
# a new certificate and soon hits Let's Encrypt rate limits.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: caddy-data
  namespace: learningsteps
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: managed-csi
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  namespace: learningsteps
  labels:
    app.kubernetes.io/name: caddy
    app.kubernetes.io/part-of: learningsteps
spec:
  # One replica: the certificate volume is ReadWriteOnce. Recreate, because
  # a rolling update would start the new pod while the old one still holds
  # the volume.
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: caddy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: caddy
      annotations:
        # Changes to the Caddyfile roll the pod (set by render.sh).
        checksum/caddyfile: "${CADDYFILE_SHA}"
    spec:
      serviceAccountName: caddy
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Makes the Azure Disk writable for the non-root user.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: caddy
          image: ${CADDY_IMAGE}
          ports:
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: https
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
            - name: caddyfile
              mountPath: /etc/caddy
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: caddy-data
        - name: config
          emptyDir:
            sizeLimit: 16Mi
        - name: caddyfile
          configMap:
            name: caddy
---
# The public entry point, on the static IP Terraform created (so the
# certificate's identity survives Service re-creation).
apiVersion: v1
kind: Service
metadata:
  name: caddy
  namespace: learningsteps
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-resource-group: "${INGRESS_RG}"
    service.beta.kubernetes.io/azure-pip-name: "${INGRESS_PIP_NAME}"
spec:
  type: LoadBalancer
  # Keeps the real client IP in Caddy's logs (and in NetworkPolicy).
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: caddy
  ports:
    # Port 80 must stay open permanently: every renewal of the 6-day
    # certificate is validated over HTTP-01.
    - name: http
      port: 80
      targetPort: http
    - name: https
      port: 443
      targetPort: https
