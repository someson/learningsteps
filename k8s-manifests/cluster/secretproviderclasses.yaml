# Key Vault → files in the pod, via the Secrets Store CSI driver and
# Workload Identity. Applied once by an operator: SecretProviderClass is a
# CRD that the CI identity's namespace-scoped role does not cover.
#
# No secretObjects: the values are never copied into Kubernetes Secrets
# (which live in etcd and are readable by anyone with get on secrets).
---
# API pods: the application connection string only.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: db-app
  namespace: learningsteps
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "${WORKLOAD_CLIENT_ID}"
    keyvaultName: "${KEY_VAULT_NAME}"
    tenantId: "${TENANT_ID}"
    objects: |
      array:
        - |
          objectName: database-url
          objectType: secret
---
# Migration Job: the admin DSN (to create the app role) plus the app DSN
# (to know which password to give it). Azure RBAC on the individual secrets
# already restricts the admin DSN to the migrator identity; this class is
# the Kubernetes-side half of that.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: db-migrator
  namespace: learningsteps
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "${MIGRATOR_CLIENT_ID}"
    keyvaultName: "${KEY_VAULT_NAME}"
    tenantId: "${TENANT_ID}"
    objects: |
      array:
        - |
          objectName: database-admin-url
          objectType: secret
        - |
          objectName: database-url
          objectType: secret
