# Prometheus, Grafana and the Prometheus Operator (kube-prometheus-stack).
#
# Pod Security: enforce "baseline", warn/audit "restricted". The stack is
# installed without node-exporter (hostNetwork/hostPID) and should satisfy
# "restricted"; install.sh checks that with a server-side dry run and says
# whether enforce can be raised. It was not verified against a live cluster
# when this was written.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
