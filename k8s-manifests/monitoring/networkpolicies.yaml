# Grafana and Prometheus accept no traffic from other pods except what they
# need. `kubectl port-forward` enters the pod's network namespace through the
# kubelet and is not subject to these policies, so it still works.
# Egress stays open: Prometheus scrapes kubelets and the API server, Grafana's
# sidecars watch ConfigMaps through the API server.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes: ["Ingress"]
  ingress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes: ["Ingress"]
  ingress:
    # Grafana queries; Prometheus scrapes itself and its config reloader.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
