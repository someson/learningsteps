# Alert rules for LearningSteps. Used as-is by the local Prometheus and
# wrapped into a PrometheusRule for AKS by k8s-manifests/monitoring/install.sh.
# No Alertmanager: firing alerts are shown in Prometheus (Alerts) and Grafana.
groups:
  - name: learningsteps
    rules:
      - alert: LearningStepsApiDown
        expr: up{job="learningsteps-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "API instance {{ $labels.instance }} cannot be scraped"

      - alert: LearningStepsNoApiInstances
        expr: absent(up{job="learningsteps-api"} == 1)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "No API instance is up"

      - alert: LearningStepsDatabaseDown
        expr: learningsteps_db_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Instance {{ $labels.instance }} cannot reach the database"

      - alert: LearningStepsHighErrorRate
        expr: |
          sum(rate(learningsteps_http_requests_total{status=~"5.."}[5m]))
            / sum(rate(learningsteps_http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of requests fail with 5xx"

      - alert: LearningStepsHighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(learningsteps_http_request_duration_seconds_bucket{route!~"/assets|unmatched"}[5m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 API latency above 1 s"

      # Brute force or credential stuffing against password sign-in. The API
      # and Caddy throttle it; this makes it visible.
      - alert: LearningStepsLoginFailures
        expr: sum(increase(learningsteps_logins_total{result=~"failed|throttled"}[5m])) > 20
        labels:
          severity: warning
        annotations:
          summary: "{{ $value | humanize }} failed sign-ins in 5 minutes"
