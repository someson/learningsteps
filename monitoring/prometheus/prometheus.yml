# Prometheus for the local docker compose stack (profile "monitoring").
# In AKS the same job is defined by a PodMonitor (k8s-manifests/monitoring/),
# with the same job label, so the dashboard and rules work unchanged.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  # The API's metrics port (METRICS_PORT, 9000), over the compose network.
  # Separate from the app port 8000, which is the only one Caddy proxies.
  - job_name: learningsteps-api
    static_configs:
      - targets: ["api:9000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
